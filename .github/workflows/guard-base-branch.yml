name: Guard base branch

# Close the "PR straight into main" gap. main is production and may only receive
# PRs from develop (the integration branch) or an emergency release/hotfix branch.
# Any other source branch targeting main fails this required check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: PR into main must come from develop
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$HEAD" in
            develop|release/*|hotfix/*)
              echo "OK: '$HEAD' -> main allowed."
              ;;
            *)
              echo "::error::PR into 'main' must come from 'develop', 'release/*', or 'hotfix/*' (got '$HEAD'). Open the PR against 'develop' instead." >&2
              exit 1
              ;;
          esac
