name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

# Guard/spec verification remains the enforcement floor. Application jobs add the
# Merchant runtime, dependency, build and cross-platform smoke contracts.
jobs:
  pr-base-guard:
    # Branch policy: main only ever advances via a release PR from develop. Branch
    # protection / rulesets are unavailable on a free private repo, so this job is the
    # enforcement: any PR whose base is main but whose head is NOT develop fails here.
    name: PR base guard
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only develop may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "PR into main must come from develop (release PR only); got head='$HEAD_REF'." >&2
            echo "Retarget this PR to develop." >&2
            exit 1
          fi

  verify:
    name: guards + spec-trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard regression tests
        # Tier 1 floor: the single check engine (.ai/bin/check-*.sh) is exercised by its
        # adversarial test suite here so it cannot drift / be weakened silently — a loosened
        # guard fails its own paired block/allow case and reds the build. Runs EVERY
        # *.test.sh under .claude/hooks/tests/ (destructive, hook-bypass, secrets, gate-task).
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=( .claude/hooks/tests/*.test.sh )
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No guard tests found under .claude/hooks/tests/ — expected the suite." >&2
            exit 1
          fi
          status=0
          for t in "${tests[@]}"; do
            echo "::group::guard-test ${t}"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Secret scan
        # Tier 1 floor: full-tree secret scan (single source: .ai/bin/check-secrets.sh).
        # --all scans the whole tree (not just a staged diff) so CI catches anything that
        # slipped past a local pre-commit hook or was committed without core.hooksPath set.
        # SECRET_GUARD_SKIP is force-cleared here so a stray env value cannot neuter the
        # CI scan (the local-only human override must not exist in the floor).
        env:
          SECRET_GUARD_SKIP: ''
        run: .ai/bin/check-secrets.sh --all
      - name: Setup Python
        # Pin the interpreter the REQ-coverage step relies on (spec_trace.py) instead of
        # whatever python3 the runner image happens to ship.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Spec trace (REQ coverage)
        # Tier 1 floor: every REQ in each feature's requirements.md must be referenced in
        # design.md and tasks.md. Fails the build on any uncovered REQ. Runs once per
        # feature dir under .claude/specs/ (skips dirs without a requirements.md, e.g. .gitkeep).
        run: |
          set -euo pipefail
          status=0
          for dir in .claude/specs/*/; do
            [ -f "${dir}requirements.md" ] || continue
            feature="$(basename "$dir")"
            echo "::group::spec-trace ${feature}"
            scripts/spec-trace.sh "$feature" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  application:
    name: application / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        if: runner.os == 'Linux'
        run: npm run audit:production
      - name: Test
        if: runner.os == 'Linux'
        run: npm test
      - name: Lint
        if: runner.os == 'Linux'
        run: npm run lint
      - name: TypeScript
        if: runner.os == 'Linux'
        run: npx tsc --noEmit
      - name: No focused or skipped tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if git grep -nE '(describe|it|test)\.(only|skip)[[:space:]]*\(' -- '*.test.*'; then
            echo 'Focused or skipped test found.' >&2
            exit 1
          fi
      - name: Build
        if: runner.os == 'Linux'
        run: npm run build

      - name: Staging and production smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime_pid=''

          cleanup_runtime() {
            if [ -n "$runtime_pid" ]; then
              kill -- "-$runtime_pid" 2>/dev/null || true
              wait "$runtime_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_runtime EXIT

          smoke_profile() {
            local runtime_profile="$1"
            local log_file="$RUNNER_TEMP/${runtime_profile}.log"
            local runtime_ready=0

            setsid npm run "$runtime_profile" >"$log_file" 2>&1 &
            runtime_pid=$!
            for task_attempt in {1..60}; do
              if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
                runtime_ready=1
                break
              fi
              sleep 1
            done
            if [ "$runtime_ready" -ne 1 ]; then
              sed -n '1,240p' "$log_file"
              exit 1
            fi
            test "$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health)" = '{"status":"ok"}'
            cleanup_runtime
            runtime_pid=''
          }

          smoke_profile start:staging
          smoke_profile start:production

      - name: macOS development smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/development.log"
          dev_pid=''

          cleanup_dev() {
            while read -r listener_pid; do
              [ -n "$listener_pid" ] && kill "$listener_pid" 2>/dev/null || true
            done < <(lsof -tiTCP:5300 -sTCP:LISTEN 2>/dev/null || true)
            [ -n "$dev_pid" ] && kill "$dev_pid" 2>/dev/null || true
            [ -n "$dev_pid" ] && wait "$dev_pid" 2>/dev/null || true
          }
          trap cleanup_dev EXIT

          npm run dev:clean >"$log_file" 2>&1 &
          dev_pid=$!
          dev_ready=0
          for task_attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:5300/login >/dev/null; then
              dev_ready=1
              break
            fi
            sleep 1
          done
          if [ "$dev_ready" -ne 1 ]; then
            sed -n '1,240p' "$log_file"
            exit 1
          fi
          test "$(curl --fail --silent --show-error http://127.0.0.1:5300/api/health)" = '{"status":"ok"}'

      - name: Windows development smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'development.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'development.stderr.log'
          $devProcess = Start-Process -FilePath 'cmd.exe' `
            -ArgumentList '/d', '/s', '/c', 'npm run dev:clean' `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          try {
            $devReady = $false
            foreach ($taskAttempt in 1..60) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5300/login
                if ($response.StatusCode -eq 200) {
                  $devReady = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $devReady) {
              Get-Content $stdoutPath, $stderrPath -ErrorAction SilentlyContinue
              throw 'Development server did not start on port 5300.'
            }
            $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5300/api/health
            if ($health.Content.Trim() -ne '{"status":"ok"}') {
              throw "Unexpected health body: $($health.Content)"
            }
          } finally {
            Get-NetTCPConnection -LocalPort 5300 -State Listen -ErrorAction SilentlyContinue |
              ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
            if (-not $devProcess.HasExited) {
              Stop-Process -Id $devProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }
